[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Chat with Nietzsche — hybrid RAG over 19 of Nietzsche's works"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.16.0",
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "httpx>=0.27.0",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "sentry-sdk>=2.75.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
